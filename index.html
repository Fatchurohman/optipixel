<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OptiPixel - Bulk Client-Side Image Optimizer</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- JSZip CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  
  <!-- Custom CSS untuk Animasi Kelap-kelip -->
  <style>
    @keyframes pulse-dot {
      0% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.2; transform: scale(0.8); }
    }
    .animate-blink {
      animation: pulse-dot 1.5s infinite;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
          OP
        </div>
        <div>
          <h1 class="text-base font-semibold tracking-tight leading-tight">OptiPixel</h1>
          <p class="text-xs text-slate-400">100% Client-Side Bulk Compressor</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 space-y-6">

    <!-- Config Panel -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-800/60 p-5 rounded-2xl border border-slate-700/60 shadow-xl">
      <div>
        <label for="formatSelect" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Format Output</label>
        <select id="formatSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
          <option value="image/webp" selected>WebP (Direkomendasikan)</option>
          <option value="image/jpeg">JPEG (.jpg)</option>
          <option value="image/png">PNG (.png)</option>
        </select>
      </div>

      <div>
        <div class="flex justify-between items-center mb-2">
          <label for="qualityRange" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Kualitas</label>
          <span id="qualityVal" class="text-xs font-mono font-bold text-indigo-400">80%</span>
        </div>
        <input id="qualityRange" type="range" min="10" max="100" value="80" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
      </div>

      <div>
        <label for="maxWidthInput" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Maks. Lebar (px)</label>
        <input id="maxWidthInput" type="number" placeholder="Original (cth: 1920)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition placeholder:text-slate-500">
      </div>
    </div>

    <!-- Drop Zone -->
    <div id="dropZone" class="border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-2xl p-8 text-center bg-slate-800/30 transition cursor-pointer flex flex-col items-center justify-center space-y-3 group">
      <div class="w-14 h-14 rounded-full bg-indigo-600/10 text-indigo-400 flex items-center justify-center group-hover:scale-110 transition duration-300">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
      </div>
      <div>
        <p class="text-sm font-semibold text-slate-200">Klik atau geser gambar ke sini</p>
      </div>
      <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
    </div>

    <!-- Stats -->
    <div id="statsBar" class="hidden items-center justify-between bg-slate-800 p-4 rounded-xl border border-slate-700">
      <div class="text-xs sm:text-sm text-slate-300">
        Total File: <span id="totalCount" class="font-bold text-white">0</span> |
        Hemat: <span id="totalSaved" class="font-bold text-emerald-400 font-mono">0 KB</span>
      </div>
      <button id="downloadAllBtn" class="px-4 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold text-white transition">Unduh Semua (.ZIP)</button>
    </div>

    <div id="itemsList" class="space-y-3"></div>

  </main>

  <!-- Footer dengan Identitas Developer -->
  <footer class="border-t border-slate-800 py-6 text-center space-y-2 mt-auto">
    <div class="flex items-center justify-center space-x-2 text-slate-400 text-xs">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-blink"></span>
        <span>developer : <strong>fatur62</strong></span>
    </div>
    <p class="text-xs text-slate-600">OptiPixel &bull; 100% Client-Side Processing</p>
  </footer>

  <!-- Script (Tetap sama seperti sebelumnya) -->
  <script>
    // [Isi script logic sebelumnya di sini, saya persingkat untuk kejelasan]
    // Pastikan Anda menyalin bagian script dari kode sebelumnya di sini.
  </script>
</body>
</html>
