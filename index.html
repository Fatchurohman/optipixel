<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OptiPixel - Bulk Image Optimizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  
  <style>
    @keyframes pulse-dot {
      0% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.2; transform: scale(0.8); }
    }
    .animate-blink { animation: pulse-dot 1.5s infinite; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4">
      <!-- Judul Utama -->
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">OP</div>
          <div>
            <h1 class="text-base font-semibold tracking-tight leading-tight">OptiPixel</h1>
            <p class="text-xs text-slate-400">100% Client-Side Bulk Compressor</p>
          </div>
        </div>
      </div>
      
      <!-- Posisi Baru Identitas Developer -->
      <div class="flex items-center justify-center mt-3 pt-3 border-t border-slate-800/50">
        <div class="flex items-center space-x-2 text-[10px] uppercase tracking-widest text-slate-500 font-medium">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-blink"></span>
          <span>developer: fatur62</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 space-y-6">
    <!-- Config Panel -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-800/60 p-5 rounded-2xl border border-slate-700/60 shadow-xl">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Format</label>
        <select id="formatSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
          <option value="image/webp" selected>WebP</option>
          <option value="image/jpeg">JPEG</option>
          <option value="image/png">PNG</option>
        </select>
      </div>
      <div>
        <div class="flex justify-between items-center mb-2">
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Kualitas</label>
          <span id="qualityVal" class="text-xs font-mono font-bold text-indigo-400">80%</span>
        </div>
        <input id="qualityRange" type="range" min="10" max="100" value="80" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Lebar (px)</label>
        <input id="maxWidthInput" type="number" placeholder="Original" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
      </div>
    </div>

    <!-- Drop Zone -->
    <div id="dropZone" class="border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-2xl p-8 text-center bg-slate-800/30 transition cursor-pointer flex flex-col items-center justify-center space-y-3">
      <div class="text-indigo-400"><svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></div>
      <p class="text-sm font-semibold text-slate-200">Klik atau geser gambar ke sini</p>
      <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
    </div>

    <!-- Stats -->
    <div id="statsBar" class="hidden items-center justify-between bg-slate-800 p-4 rounded-xl border border-slate-700">
      <div class="text-xs text-slate-300">Total: <span id="totalCount" class="font-bold text-white">0</span> | Hemat: <span id="totalSaved" class="font-bold text-emerald-400">0 KB</span></div>
      <button id="downloadAllBtn" class="px-4 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold text-white transition">Unduh (.ZIP)</button>
    </div>

    <div id="itemsList" class="space-y-3"></div>
  </main>

  <!-- Script Logic -->
  <script>
    'use strict';
    const state = { files: [] };
    const dropZone = document.getElementById('dropZone'), fileInput = document.getElementById('fileInput'), qualityRange = document.getElementById('qualityRange'), qualityVal = document.getElementById('qualityVal'), formatSelect = document.getElementById('formatSelect'), maxWidthInput = document.getElementById('maxWidthInput'), itemsList = document.getElementById('itemsList'), statsBar = document.getElementById('statsBar'), totalCount = document.getElementById('totalCount'), totalSaved = document.getElementById('totalSaved'), downloadAllBtn = document.getElementById('downloadAllBtn');

    const formatBytes = (b) => { if(b<=0) return '0 B'; const k=1024, i=Math.floor(Math.log(b)/Math.log(k)); return parseFloat((b/Math.pow(k, i)).toFixed(1)) + [' B',' KB',' MB'][i]; };
    
    const compressImage = async (file, options) => {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          let {width, height} = img;
          const maxWidth = parseInt(options.maxWidth, 10);
          if(maxWidth && width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          if(options.format === 'image/jpeg') { ctx.fillStyle = '#FFF'; ctx.fillRect(0,0,width,height); }
          ctx.drawImage(img, 0, 0, width, height);
          canvas.toBlob(resolve, options.format, options.quality);
        };
        img.src = URL.createObjectURL(file);
      });
    };

    const processFiles = async () => {
      for(let item of state.files.filter(f => f.status === 'pending')) {
        item.status = 'processing'; render();
        const blob = await compressImage(item.originalFile, { quality: qualityRange.value/100, format: formatSelect.value, maxWidth: maxWidthInput.value });
        item.compressedBlob = blob; item.compressedSize = blob.size; item.status = 'done'; item.previewUrl = URL.createObjectURL(blob);
      }
      render(); updateStats();
    };

    const updateStats = () => {
      statsBar.classList.remove('hidden'); statsBar.classList.add('flex');
      let orig = 0, comp = 0;
      state.files.filter(f => f.status === 'done').forEach(f => { orig += f.originalSize; comp += f.compressedSize; });
      totalCount.textContent = state.files.length;
      totalSaved.textContent = formatBytes(Math.max(0, orig - comp));
    };

    const render = () => {
      itemsList.innerHTML = state.files.map(item => `
        <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-3 flex items-center justify-between">
          <div class="flex items-center space-x-3 overflow-hidden">
            <div class="w-10 h-10 rounded-lg bg-slate-900 border border-slate-700 flex-shrink-0"><img src="${item.previewUrl || ''}" class="w-full h-full object-cover rounded-lg"></div>
            <div class="text-xs text-slate-300 truncate">${item.originalFile.name}</div>
          </div>
          ${item.status === 'done' ? `<a href="${item.previewUrl}" download class="text-indigo-400 font-bold text-xs">Unduh</a>` : '<span class="text-xs animate-pulse text-indigo-500">Proses...</span>'}
        </div>
      `).join('');
    };

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      Array.from(e.target.files).forEach(f => state.files.push({originalFile: f, originalSize: f.size, status: 'pending'}));
      processFiles();
    });
    qualityRange.addEventListener('input', (e) => qualityVal.textContent = e.target.value + '%');
    
    downloadAllBtn.addEventListener('click', async () => {
      const zip = new JSZip();
      state.files.forEach((f, i) => zip.file(`img_${i}.webp`, f.compressedBlob));
      const blob = await zip.generateAsync({type:'blob'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'OptiPixel_Batch.zip'; a.click();
    });
  </script>
</body>
</html>
